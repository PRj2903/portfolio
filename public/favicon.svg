<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Letter P Gradient -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Dot Gradient (Golden Amber) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Tech Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="112" 
    fill="url(#bgGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="12" 
  />

  <!-- Subtle ambient inner grid or glow -->
  <circle cx="256" cy="200" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Code Bracket Left Accent: < -->
  <path 
    d="M 148 190 L 108 240 L 148 290" 
    fill="none" 
    stroke="#818cf8" 
    stroke-width="20" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    opacity="0.75"
  />

  <!-- Main Monogram 'P' -->
  <path 
    d="M 196 136 
       L 296 136 
       C 348 136 384 168 384 216 
       C 384 264 348 296 296 296 
       L 248 296 
       L 248 376" 
    fill="none" 
    stroke="url(#pGrad)" 
    stroke-width="38" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#subtleShadow)"
  />

  <!-- Inner stem of 'P' for solid balance -->
  <line 
    x1="196" 
    y1="136" 
    x2="196" 
    y2="376" 
    stroke="url(#pGrad)" 
    stroke-width="38" 
    stroke-linecap="round"
  />

  <!-- Glowing Accent Dot (The signature 'PRATHAM.' dot) -->
  <circle 
    cx="354" 
    cy="376" 
    r="24" 
    fill="url(#goldGrad)" 
    filter="url(#glow)" 
  />
</svg>